name: release

on:
  push:
    tags:
      # Publish on version tags, e.g. v0.1.0
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+dev[0-9]+"

jobs:
  # See https://docs.astral.sh/uv/guides/integration/github/#publishing-to-pypi
  check_and_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for Trusted Publishing + attest-action
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        # Install a specific version of uv.
        version: "0.12.10"
    
    - name: Install dependencies
      run: |
        uv sync --all-groups

    - name: Run tests
      run: |
        uv run pytest --cov --cov-report=xml

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Check code formatting with Black
      run: |
        uv run black --check .

    - name: Lint code with Flake8
      run: |
        uv run flake8
    
    - name: Build package
      run: |
        uv build

    - name: Smoke test (wheel)
      run: uv run --isolated --no-project --with dist/*.whl "import pycoupler; print(pycoupler.read_config)"
    - name: Smoke test (source distribution)
      run: uv run --isolated --no-project --with dist/*.tar.gz "import pycoupler; print(pycoupler.read_config)"

    - name: Upload distributions as artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist
        path: dist/

  publish:
    runs-on: ubuntu-latest
    needs:
      - check_and_build
    environment:
      name: pypi
    permissions:
      contents: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Install a specific version of uv.
          version: "0.12.10"

      - name: Download distributions artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
      
      - name: Publish
        run: uv publish

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ github.ref_name }}: Automated release"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/*