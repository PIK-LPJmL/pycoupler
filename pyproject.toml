[project]
name = "pycoupler"
version = "1.7.1"
description = "dynamic model coupling of LPJmL"
readme = "README.md"
license = {file = "LICENSE.md"}
authors = [
    { name = "Jannes Breier", email = "jannes.breier@pik-potsdam.de" },
    { name = "Lorenz Sieben", email = "sieben@gea.mpg.de" },
]
requires-python = ">=3.9"
keywords = ["DGVM", "ABM", "model coupling", "LPJmL", "copan:CORE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "numpy>=1.20.3",
    "netCDF4>=1.5.8",
    "xarray>=0.21.1",
    "pandas<3.0.0",
    "scipy>=1.7.1",
    "ruamel.yaml>=0.17.16",
    "fuzzywuzzy>=0.18.0",
    "Levenshtein>=0.12.2"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-subprocess",
    "sphinx",
    "black",
    "flake8",
    "autohooks>=26.2.0",
    "autohooks-plugin-flake8>=23.10.0",
    "autohooks-plugin-black>=23.10.0",
]

[project.urls]
homepage = "https://github.com/PIK-LPJmL/pycoupler"
issues = "https://github.com/PIK-LPJmL/pycoupler/issues"
documentation = "https://github.com/PIK-LPJmL/pycoupler/wiki"
repository = "https://github.com/PIK-LPJmL/pycoupler"

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name="pycoupler"
module-root=""

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--strict-markers"

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310']
extend-exclude = "pycoupler/_version.py"

[tool.autohooks]
mode = "uv"
pre-commit = ["autohooks.plugins.black", "autohooks.plugins.flake8"]
